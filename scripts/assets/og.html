<!DOCTYPE html>
<!-- Plantilla de las imágenes para compartir (og/og-*.png). La renderiza scripts/build-assets.sh con Chrome headless.
     Parámetros: ?t=titular&s=subtítulo -->
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@500;700&family=Martian+Mono:wght@400;700&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #14101F; color: #FFF3E2; font-family: 'Instrument Sans', sans-serif; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .b1 { width: 560px; height: 560px; top: -220px; left: -160px; background: #FF5E5B; }
  .b2 { width: 520px; height: 520px; bottom: -260px; right: -120px; background: #FFA62B; }
  .b3 { width: 360px; height: 360px; top: 160px; left: 560px; background: #B6EF3C; opacity: .22; }
  .content { position: absolute; left: 80px; top: 70px; width: 700px; height: 490px; display: flex; flex-direction: column; }
  .wordmark { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -.045em; line-height: 1; }
  .wordmark .punto { display: inline-block; width: .34em; height: .38em; margin: 0 .03em; }
  .wordmark .punto svg { width: 100%; height: 100%; display: block; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 66px; line-height: 1.02; letter-spacing: -.03em; margin: auto 0 18px; }
  .sub { font-size: 28px; font-weight: 500; color: rgba(255,243,226,.78); margin: 0 0 34px; }
  .url { font-family: 'Martian Mono', monospace; font-size: 20px; letter-spacing: .04em; color: #FF5E5B; font-weight: 700; }
  .icon { position: absolute; right: 90px; top: 135px; width: 330px; height: 330px; border-radius: 72px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="content">
    <div class="wordmark">tutti<span class="punto"><svg viewBox="10 4 80 88"><path d="M50 36 C41 27 26 28 19 42 C12 56 15 71 25 80 C34 88 44 90 50 90 C56 90 66 88 75 80 C85 71 88 56 81 42 C74 28 59 27 50 36 Z" fill="#FF5E5B"/><path d="M51 35 C57 19 73 9 85 7 C84 22 71 34 51 35 Z" fill="#B6EF3C"/><path d="M48 35 C43 22 32 14 22 12 C23 26 33 34 48 35 Z" fill="#8FD32E"/></svg></span>frutti</div>
    <h1 id="t"></h1>
    <p class="sub" id="s"></p>
    <div class="url">tuttipuntofrutti.com</div>
  </div>
  <img class="icon" src="../../icons/icon-512.png" alt="" />
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById("t").textContent = q.get("t");
  document.getElementById("s").textContent = q.get("s");
</script>
</body>
</html>
